# Render Blueprint: 저장소를 연결하면 이 설정대로 웹 서비스 1개가 만들어진다.
# 공개 시연용이므로 데모 모드를 켜고, 비밀키는 Render가 무작위로 생성한다(저장소의 개발용 키 사용 안 함).
# 무료 플랜은 디스크가 없어 재시작 때마다 데모 데이터를 오늘 날짜 기준으로 다시 만든다.
services:
  - type: web
    name: allostar-consult
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: always
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_API_KEY
        generateValue: true
